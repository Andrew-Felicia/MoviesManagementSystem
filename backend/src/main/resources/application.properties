spring.application.name=MovieLibrary

spring.datasource.url=jdbc:postgresql://localhost:5432/movie_library
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=none

# Create the authentication table on existing installations before JPA starts.
spring.sql.init.mode=always

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# The first administrator is created on startup if it does not exist.
# Override both values in production with ADMIN_USERNAME and ADMIN_PASSWORD.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
